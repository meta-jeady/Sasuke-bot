<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kčø4p tech • SASUKE-BOT V36</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080a12;--card:#13151f;--border:#252839;--text:#e8e8e8;--muted:#9ca3af;--accent:#7c3aed;--accent2:#ef4444;--green:#22c55e;--red:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow-x:hidden}
body::before{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 30% 20%,rgba(124,58,237,.15),transparent 50%),radial-gradient(circle at 80% 80%,rgba(239,68,68,.12),transparent 50%);pointer-events:none}
.container{width:100%;max-width:440px;position:relative;z-index:1}
header{text-align:center;margin-bottom:24px}
.logo-img{width:120px;height:120px;border-radius:50%;border:3px solid var(--accent);box-shadow:0 0 30px rgba(124,58,237,.5),0 0 60px rgba(124,58,237,.2);margin-bottom:14px;object-fit:cover;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.logo{font-family:'Orbitron',sans-serif;font-size:1.9rem;font-weight:900;background:linear-gradient(90deg,#a78bfa,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
.owner{color:var(--muted);font-size:.85rem;margin-top:4px;letter-spacing:.5px}
.owner b{color:#a78bfa}
.card{background:rgba(19,21,31,.9);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:20px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.status-box{display:flex;gap:12px;align-items:center;padding:14px;background:#0f1118;border-radius:12px;border:1px solid var(--border);margin-bottom:18px;font-size:.9rem;font-weight:600}
.dot{width:12px;height:12px;border-radius:50%;background:var(--muted);animation:pulse 2s infinite}
.dot.ok{background:var(--green);box-shadow:0 0 10px var(--green)}
.dot.wait{background:#f59e0b;box-shadow:0 0 10px #f59e0b}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
label{color:var(--muted);font-size:.8rem;font-weight:600;letter-spacing:.5px;margin-bottom:6px;display:block}
input{width:100%;background:#0f1118;border:1px solid var(--border);border-radius:12px;padding:15px;color:#fff;font-size:1rem;outline:none;margin-bottom:14px;transition:.3s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,58,237,.2)}
button#btn{width:100%;background:linear-gradient(135deg,var(--accent),#6d28d9);border:none;border-radius:12px;padding:15px;color:#fff;font-weight:800;cursor:pointer;font-size:1rem;letter-spacing:.5px;transition:.3s;box-shadow:0 8px 20px rgba(124,58,237,.3)}
button:disabled{opacity:.5}
.code-box{display:none;text-align:center;margin-top:22px;padding:18px;background:#0f1118;border-radius:14px;border:1px dashed var(--accent)}
.code-box.show{display:block;animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.code{font-family:'Orbitron',monospace;font-size:2.8rem;letter-spacing:10px;color:#a78bfa;background:#080a12;padding:18px;border-radius:12px;border:1px solid var(--accent);margin:14px 0;font-weight:700;user-select:all;-webkit-user-select:all;cursor:pointer}
.hint{color:var(--muted);font-size:.82rem;line-height:1.6}
.err{color:var(--red);text-align:center;font-size:.9rem;min-height:18px;margin-top:10px;font-weight:600}
.bots{margin-top:20px}
.bots-title{color:var(--muted);font-size:.85rem;margin-bottom:12px;text-align:center;font-weight:600}
.bot-card{background:rgba(15,17,24,.9);border:1px solid var(--border);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:10px}
.bot-avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:800}
.bot-info{flex:1;text-align:left}
.bot-num{font-weight:800;font-size:.95rem}
.bot-status{color:var(--green);font-size:.8rem;font-weight:600}
.bot-date{color:var(--muted);font-size:.72rem}
.copy-btn{margin-top:12px;background:#1a1c24;border:1px solid var(--accent);color:#a78bfa;padding:11px 18px;border-radius:10px;font-size:.9rem;font-weight:700;cursor:pointer;width:auto}
.copy-btn.copied{background:var(--green);border-color:var(--green);color:#fff}
.channel-btn{display:block;text-align:center;margin-top:18px;background:rgba(124,58,237,.1);border:1px solid var(--accent);color:#a78bfa;padding:13px;border-radius:12px;text-decoration:none;font-weight:700;font-size:.9rem}
.footer{text-align:center;margin-top:20px;color:var(--muted);font-size:.75rem}
</style>
</head>
<body>
<div class="container">
<header>
<img src="logo.jpg" class="logo-img" onerror="this.style.display='none'">
<div class="logo">kčø4p tech</div>
<div class="owner">Propulsé par <b>SASUKE-BOT V36</b> • Owner: <b>kčø4p tech</b></div>
</header>
<div class="card">
<div class="status-box"><div id="dot" class="dot"></div><div id="status">Chargement...</div></div>
<label>NUMÉRO WHATSAPP</label>
<input id="phone" placeholder="237687960259" maxlength="15">
<button id="btn" onclick="getCode()">OBTENIR MON CODE</button>
<div id="err" class="err"></div>
<div id="box" class="code-box">
<div style="color:var(--muted);font-size:.85rem;font-weight:600;letter-spacing:1px">TON CODE DE PAIRING</div>
<div id="code" class="code" onclick="copyCode()">--------</div>
<button class="copy-btn" id="copyBtn" type="button" onclick="copyCode()">📋 Copier le code</button>
<div class="hint" style="margin-top:12px">Clique sur le code pour copier<br>WhatsApp > Appareils connectés > Lier avec numéro</div>
</div>
<a class="channel-btn" href="https://whatsapp.com/channel/0029VbE0WHTKWEKo9iyxl43e" target="_blank">📢 View Channel 👆👆</a>
</div>
<div id="bots" class="bots"></div>
<div class="footer">© 2026 kčø4p tech • SASUKE-BOT V36</div>
</div>
<script>
const dot=document.getElementById('dot'),st=document.getElementById('status'),box=document.getElementById('box'),code=document.getElementById('code'),err=document.getElementById('err'),btn=document.getElementById('btn'),bots=document.getElementById('bots'),copyBtn=document.getElementById('copyBtn');

async function refresh(){
 try{
  const r=await fetch('/api/status'); const d=await r.json();
  st.textContent=d.status; dot.className='dot '+(d.status.includes('Connecté')?'ok':'wait');
  const b=await fetch('/api/bots'); const bd=await b.json();
  if(bd.total>0){
    let html=`<div class="bots-title">🤖 ${bd.total} BOT(S) CONNECTÉ(S)</div>`;
    bd.bots.forEach(bot=>{
      html+=`<div class="bot-card">
        <div class="bot-avatar">${bot.number.slice(-2)}</div>
        <div class="bot-info">
          <div class="bot-num">+${bot.number}</div>
          <div class="bot-status">● ${bot.status}</div>
          <div class="bot-date">${bot.connectedAt||''} • kčø4p tech</div>
        </div>
        <div style="color:var(--green);font-size:1.2rem">●</div>
      </div>`;
    });
    bots.innerHTML=html;
  } else {
    bots.innerHTML=`<div class="bots-title">En attente de connexion...</div>`;
  }
 }catch{st.textContent='Serveur hors ligne'; dot.className='dot'}
}

async function getCode(){
 const num=document.getElementById('phone').value.replace(/[^0-9]/g,'');
 if(num.length<10){err.textContent='Mets un numéro valide';return}
 btn.disabled=true; btn.textContent='GÉNÉRATION...'; err.textContent='';
 try{
  const r=await fetch('/api/pair/'+num); const d=await r.json();
  if(d.error) err.textContent=d.error;
  else{code.textContent=d.code; box.classList.add('show'); copyBtn.textContent='📋 Copier le code'; copyBtn.classList.remove('copied');}
 }catch{err.textContent='Erreur réseau'}
 btn.disabled=false; btn.textContent='OBTENIR MON CODE';
}

function copyCode(){
  const txt = code.innerText.trim();
  if(!txt || txt.includes('-')) return;
  const input = document.createElement('input');
  input.value = txt;
  document.body.appendChild(input);
  input.select();
  input.setSelectionRange(0, 99999);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch(e){}
  document.body.removeChild(input);
  if(navigator.clipboard) navigator.clipboard.writeText(txt).catch(()=>{});
  if(ok){
    copyBtn.textContent='✅ Copié !';
    copyBtn.classList.add('copied');
    err.style.color='#22c55e';
    err.textContent='✅ Code copié: '+txt;
    setTimeout(()=>{copyBtn.textContent='📋 Copier le code'; copyBtn.classList.remove('copied'); err.textContent=''; err.style.color='';},3000);
  } else {
    prompt('Copie manuelle:', txt);
  }
}

refresh(); setInterval(refresh,3000);
</script>
</body>
 </html>

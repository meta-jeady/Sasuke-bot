<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SASUKE-BOT • Pairing</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0c10;--card:#15171e;--border:#2a2d3a;--text:#e8e8e8;--muted:#9ca3af;--accent:#7c3aed;--green:#22c55e;--red:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.container{width:100%;max-width:420px}
header{text-align:center;margin-bottom:24px}
.logo-img{width:110px;height:110px;border-radius:50%;border:3px solid var(--accent);box-shadow:0 0 25px rgba(124,58,237,.4);margin-bottom:12px;object-fit:cover}
.logo{font-family:'Orbitron',sans-serif;font-size:1.7rem;background:linear-gradient(90deg,#a78bfa,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px}
.status-box{display:flex;gap:10px;align-items:center;padding:12px;background:#1a1c24;border-radius:10px;border:1px solid var(--border);margin-bottom:18px;font-size:.9rem}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--green);box-shadow:0 0 8px var(--green)}
.dot.wait{background:#f59e0b;box-shadow:0 0 8px #f59e0b}
input{width:100%;background:#1a1c24;border:1px solid var(--border);border-radius:10px;padding:14px;color:#fff;font-size:1rem;outline:none;margin-bottom:12px}
input:focus{border-color:var(--accent)}
button{width:100%;background:linear-gradient(135deg,var(--accent),#6d28d9);border:none;border-radius:10px;padding:14px;color:#fff;font-weight:700;cursor:pointer;font-size:1rem}
button:disabled{opacity:.5}
.code-box{display:none;text-align:center;margin-top:20px}
.code-box.show{display:block}
.code{font-family:'Orbitron',monospace;font-size:2.6rem;letter-spacing:8px;color:#a78bfa;background:#1a1c24;padding:16px;border-radius:12px;border:1px solid var(--accent);margin:12px 0}
.hint{color:var(--muted);font-size:.84rem;line-height:1.5}
.err{color:var(--red);text-align:center;font-size:.9rem;min-height:18px;margin-top:8px}
.bots{margin-top:18px}
.bots-title{color:var(--muted);font-size:.9rem;margin-bottom:10px;text-align:center}
.bot-card{background:#1a1c24;border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:10px}
.bot-avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#ef4444);display:flex;align-items:center;justify-content:center;font-weight:700}
.bot-info{flex:1;text-align:left}
.bot-num{font-weight:700;font-size:.95rem}
.bot-status{color:var(--green);font-size:.8rem}
.bot-date{color:var(--muted);font-size:.75rem}
.copy-btn{margin-top:10px;background:#1a1c24;border:1px solid var(--accent);color:#a78bfa;padding:10px 16px;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;width:auto}
.copy-btn.copied{background:var(--green);border-color:var(--green);color:#fff}
</style>
</head>
<body>
<div class="container">
<header>
<img src="logo.jpg" class="logo-img" onerror="this.style.display='none'">
<div class="logo">SASUKE-BOT</div>
</header>
<div class="card">
<div class="status-box"><div id="dot" class="dot"></div><div id="status">Chargement...</div></div>
<input id="phone" placeholder="237687960259" maxlength="15">
<button id="btn" onclick="getCode()">Obtenir mon Code</button>
<div id="err" class="err"></div>
<div id="box" class="code-box">
<div style="color:var(--muted);font-size:.9rem">TON CODE :</div>
<div id="code" class="code">--------</div>
<button class="copy-btn" id="copyBtn" onclick="copyCode()">📋 Copier le code</button>
<div class="hint">WhatsApp > Appareils connectés > Lier un appareil > <b>Lier avec un numéro</b></div>
</div>
</div>
<div id="bots" class="bots"></div>
</div>
<script>
const dot=document.getElementById('dot'),st=document.getElementById('status'),box=document.getElementById('box'),code=document.getElementById('code'),err=document.getElementById('err'),btn=document.getElementById('btn'),bots=document.getElementById('bots'),copyBtn=document.getElementById('copyBtn');

async function refresh(){
 try{
  const r=await fetch('/api/status'); const d=await r.json();
  st.textContent=d.status; dot.className='dot '+(d.status.includes('Connecté')?'ok':'wait');
  const b=await fetch('/api/bots'); const bd=await b.json();
  if(bd.total>0){
    let html=`<div class="bots-title">🤖 ${bd.total} Bot(s) Connecté(s)</div>`;
    bd.bots.forEach(bot=>{
      html+=`<div class="bot-card">
        <div class="bot-avatar">${bot.number.slice(-2)}</div>
        <div class="bot-info">
          <div class="bot-num">+${bot.number}</div>
          <div class="bot-status">${bot.status}</div>
          <div class="bot-date">${bot.connectedAt||''}</div>
        </div>
        <div style="color:var(--green)">●</div>
      </div>`;
    });
    bots.innerHTML=html;
  } else {
    bots.innerHTML=`<div class="bots-title">En attente de connexion...</div>`;
  }
 }catch{st.textContent='Serveur hors ligne'}
}
async function getCode(){
 const num=document.getElementById('phone').value.replace(/[^0-9]/g,'');
 if(num.length<10){err.textContent='Mets un numéro valide';return}
 btn.disabled=true; btn.textContent='Génération...'; err.textContent='';
 try{
  const r=await fetch('/api/pair/'+num); const d=await r.json();
  if(d.error) err.textContent=d.error;
  else{code.textContent=d.code; box.classList.add('show'); copyBtn.textContent='📋 Copier le code'; copyBtn.classList.remove('copied');}
 }catch{err.textContent='Erreur réseau'}
 btn.disabled=false; btn.textContent='Obtenir mon Code';
}
function copyCode(){
  const txt=code.textContent.trim();
  if(!txt || txt.includes('-')) return;
  navigator.clipboard.writeText(txt).then(()=>{
    copyBtn.textContent='✅ Copié !';
    copyBtn.classList.add('copied');
    setTimeout(()=>{copyBtn.textContent='📋 Copier le code'; copyBtn.classList.remove('copied');},2000);
  });
}
refresh(); setInterval(refresh,3000);
</script>
</body>
</html>
